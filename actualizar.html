<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Actualizar cita — RENIEC</title>
  <link rel="stylesheet" href="css/actualizar.css">
</head>
<body>
  <h1>Actualizar cita</h1>
  <form id="form-act">
    <label>Nombre <input name="nombre" required></label>
    <label>DNI <input name="dni" required pattern="\d{8}" maxlength="8"></label>
    <label>Tipo de trámite <input name="tipo_tramite" required></label>
    <label>Sede <input name="sede" required></label>
    <button type="submit">Guardar cambios</button>
  </form>
  <p id="msg"></p>

  <script type="module">
    import { obtenerRegistro, actualizarRegistro }
      from './js/actualizar/actualizar.js';

    const id = new URLSearchParams(location.search).get('id');
    const form = document.getElementById('form-act');
    const msg  = document.getElementById('msg');

    const reg = await obtenerRegistro(id);
    if (!reg) {
      msg.textContent = 'Registro no encontrado o no es tuyo.';
    } else if (reg.estado !== 'registrado') {
      msg.textContent = 'Este registro ya fue atendido; no se puede editar.';
      form.querySelectorAll('input,button').forEach(el => el.disabled = true);
    } else {
      form.nombre.value       = reg.nombre_ciudadano;
      form.dni.value          = reg.dni;
      form.tipo_tramite.value = reg.tipo_tramite;
      form.sede.value         = reg.sede;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      await actualizarRegistro(id, {
        nombre: form.nombre.value.trim(),
        dni: form.dni.value.trim(),
        tipo_tramite: form.tipo_tramite.value.trim(),
        sede: form.sede.value.trim()
      });
      msg.textContent = 'Actualizado correctamente.';
    });
  </script>
</body>
</html>
